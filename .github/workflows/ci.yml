name: ML Security CI
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run model security scan on repository artifacts
        run: |
          set -e
          files=$(git ls-files '*.joblib' || true)
          if [ -z "$files" ]; then
            echo "No .joblib artifacts to scan"
          else
            echo "Found model artifacts:" $files
            for f in $files; do
              echo "Scanning $f"
              python ml_security_scan.py "$f"
            done
          fi

      - name: Register clean models if scan passed
        if: ${{ success() }}
        run: |
          # Register any clean .joblib models (script will skip or simulate if mlflow unavailable)
          files=$(git ls-files '*.joblib' || true)
          for f in $files; do
            echo "Registering $f"
            python register_model.py "$f"
          done
